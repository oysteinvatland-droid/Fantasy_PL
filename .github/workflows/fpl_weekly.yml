name: FPL Weekly Report – Agent Pipeline

on:
  schedule:
    - cron: '0 * * * *'   # Kjører hver time
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Send ukentlig e-post uansett deadline (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: 'Generer rapporter men hopp over faktisk e-postsending'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test_email_override:
        description: 'Overstyr mottaker for manuell test (valgfritt)'
        required: false
        default: ''

# ─────────────────────────────────────────────────────────────────────────────
# AGENT 1 – DATA
# Henter rådata fra FPL API og Firebase.
# Produserer: fpl_raw_data.json, subscribers.json, deadline_status.json
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  agent-data:
    name: "🤖 Agent 1 – Data"
    runs-on: ubuntu-latest
    outputs:
      send_weekly: ${{ steps.les-status.outputs.send_weekly }}
      has_new:     ${{ steps.les-status.outputs.has_new }}
      gw_number:   ${{ steps.les-status.outputs.gw_number }}
      hours_until: ${{ steps.les-status.outputs.hours_until }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør data-agent
        env:
          FORCE_SEND: ${{ github.event.inputs.force_send || 'false' }}
          FIREBASE_BEARER_TOKEN: ${{ secrets.FIREBASE_BEARER_TOKEN }}
          FIREBASE_REQUIRE_AUTH: ${{ vars.FIREBASE_REQUIRE_AUTH || 'false' }}
        run: python agent_data.py

      - name: Les status-outputs
        id: les-status
        run: |
          SEND=$(python -c "import json; d=json.load(open('deadline_status.json')); print(str(d['send_weekly']).lower())")
          GW=$(python -c "import json; d=json.load(open('deadline_status.json')); print(d.get('gw_number',''))")
          HOURS=$(python -c "import json; d=json.load(open('deadline_status.json')); print(d.get('hours_until',''))")
          HAS_NEW=$(cat has_new_subscribers.txt)
          echo "send_weekly=$SEND"    >> $GITHUB_OUTPUT
          echo "gw_number=$GW"        >> $GITHUB_OUTPUT
          echo "hours_until=$HOURS"   >> $GITHUB_OUTPUT
          echo "has_new=$HAS_NEW"     >> $GITHUB_OUTPUT
          echo "→ send_weekly=$SEND | gw=$GW | hours=$HOURS | has_new=$HAS_NEW"

      - name: Last opp data-artifakter
        uses: actions/upload-artifact@v4
        with:
          name: agent1-data
          path: |
            fpl_raw_data.json
            subscribers.json
            new_subscribers.json
            has_new_subscribers.txt
            deadline_status.json
            agent1_status.json
          retention-days: 1
      - name: Oppsummering Agent 1
        run: |
          python - <<'PY'
          import json, os
          s = json.load(open('agent1_status.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Agent 1 – Data\n')
              out.write('- Firebase OK: **{}**\n'.format(s['firebase_ok']))
              out.write('- Subscribers: **{}** (new: {})\n'.format(s['subscriber_count'], s['new_subscriber_count']))
              out.write('- send_weekly: **{}**\n'.format(s['send_weekly']))
          PY


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 2 – ANALYSE
# Beregner scores og rangeringer fra rådata.
# Kjører kun hvis vi skal sende ukentlig ELLER det finnes nye abonnenter.
# ─────────────────────────────────────────────────────────────────────────────
  agent-analyse:
    name: "🤖 Agent 2 – Analyse"
    runs-on: ubuntu-latest
    needs: agent-data
    if: |
      needs.agent-data.outputs.send_weekly == 'true' ||
      needs.agent-data.outputs.has_new == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data fra Agent 1
        uses: actions/download-artifact@v4
        with:
          name: agent1-data

      - name: Kjør analyse-agent
        run: python agent_analyse.py

      - name: Last opp analyse-artifakter
        uses: actions/upload-artifact@v4
        with:
          name: agent2-analyse
          path: fpl_analysis.json
          retention-days: 1


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 3A – RAPPORT (VELKOMST)
# Genererer HTML-rapporter kun for nye abonnenter.
# ─────────────────────────────────────────────────────────────────────────────
  agent-rapport-welcome:
    name: "🤖 Agent 3a – Rapport (velkomst)"
    runs-on: ubuntu-latest
    needs: [agent-data, agent-analyse]
    if: needs.agent-data.outputs.has_new == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data fra Agent 1 og 2
        uses: actions/download-artifact@v4
        with:
          pattern: agent{1,2}-*
          merge-multiple: true

      - name: Kjør rapport-agent (velkomst)
        run: python agent_rapport.py --welcome

      - name: Last opp velkomst-rapporter
        uses: actions/upload-artifact@v4
        with:
          name: agent3a-welcome-reports
          path: |
            welcome_reports.json
            reports/
          retention-days: 7


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 3B – RAPPORT (UKENTLIG)
# Genererer HTML-rapporter for alle abonnenter.
# ─────────────────────────────────────────────────────────────────────────────
  agent-rapport-weekly:
    name: "🤖 Agent 3b – Rapport (ukentlig)"
    runs-on: ubuntu-latest
    needs: [agent-data, agent-analyse]
    if: needs.agent-data.outputs.send_weekly == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data fra Agent 1 og 2
        uses: actions/download-artifact@v4
        with:
          pattern: agent{1,2}-*
          merge-multiple: true

      - name: Kjør rapport-agent (ukentlig)
        run: python agent_rapport.py

      - name: Last opp ukentlige rapporter
        uses: actions/upload-artifact@v4
        with:
          name: agent3b-weekly-reports
          path: |
            generated_reports.json
            reports/
          retention-days: 30

      - name: Oppsummering Agent 3b
        run: |
          python - <<'PY'
          import json, os
          reports = json.load(open('generated_reports.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Agent 3b – Rapport (ukentlig)\n')
              out.write('- Generated reports: **{}**\n'.format(len(reports)))
          PY


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 4A – LEVERING (VELKOMST)
# Sender velkomst-e-poster og oppdaterer Firebase.
# ─────────────────────────────────────────────────────────────────────────────
  agent-levering-welcome:
    name: "🤖 Agent 4a – Levering (velkomst)"
    runs-on: ubuntu-latest
    needs: [agent-data, agent-rapport-welcome]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data og rapporter
        uses: actions/download-artifact@v4
        with:
          pattern: agent{1,3a}-*
          merge-multiple: true

      - name: Overstyr e-post ved manuell test (valgfritt)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_email_override != '' }}
        run: |
          TEST_EMAIL="${{ github.event.inputs.test_email_override }}"
          python - <<'PY'
          import json, os
          test_email = os.environ['TEST_EMAIL']
          try:
              reports = json.load(open('welcome_reports.json'))
          except FileNotFoundError:
              reports = []
          for r in reports:
              r['email'] = test_email
          json.dump(reports, open('welcome_reports.json', 'w'), indent=2)
          print('Overstyrte {} velkomstrapporter til {}'.format(len(reports), test_email))
          PY

      - name: Kjør levering-agent (velkomst)
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          FIREBASE_BEARER_TOKEN: ${{ secrets.FIREBASE_BEARER_TOKEN }}
          FIREBASE_REQUIRE_AUTH: ${{ vars.FIREBASE_REQUIRE_AUTH || 'false' }}
        run: python agent_levering.py --welcome

      - name: Last opp levering-status (velkomst)
        uses: actions/upload-artifact@v4
        with:
          name: agent4a-delivery-status
          path: delivery_status.json
          retention-days: 7

      - name: Oppsummering Agent 4a
        run: |
          python - <<'PY'
          import json, os
          s = json.load(open('delivery_status.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Agent 4a – Levering (velkomst)\n')
              out.write('- Reports: **{}**, sent: **{}**, failed: **{}**, skipped: {}\n'.format(s['reports'], s['sent'], s['failed'], s['skipped']))
          PY


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 4B – LEVERING (UKENTLIG)
# Sender ukentlige e-poster til alle abonnenter.
# ─────────────────────────────────────────────────────────────────────────────
  agent-levering-weekly:
    name: "🤖 Agent 4b – Levering (ukentlig)"
    runs-on: ubuntu-latest
    needs: [agent-data, agent-rapport-weekly]
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data og rapporter
        uses: actions/download-artifact@v4
        with:
          pattern: agent{1,3b}-*
          merge-multiple: true

      - name: Overstyr e-post ved manuell test (valgfritt)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_email_override != '' }}
        run: |
          TEST_EMAIL="${{ github.event.inputs.test_email_override }}"
          python - <<'PY'
          import json, os
          test_email = os.environ['TEST_EMAIL']
          reports = json.load(open('generated_reports.json'))
          for r in reports:
              r['email'] = test_email
          json.dump(reports, open('generated_reports.json', 'w'), indent=2)
          print('Overstyrte {} ukentlige rapporter til {}'.format(len(reports), test_email))
          PY

      - name: Kjør levering-agent (ukentlig)
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GW_NUMBER:      ${{ needs.agent-data.outputs.gw_number }}
          HOURS_UNTIL:    ${{ needs.agent-data.outputs.hours_until }}
          FIREBASE_BEARER_TOKEN: ${{ secrets.FIREBASE_BEARER_TOKEN }}
          FIREBASE_REQUIRE_AUTH: ${{ vars.FIREBASE_REQUIRE_AUTH || 'false' }}
        run: python agent_levering.py

      - name: Last opp levering-status (ukentlig)
        uses: actions/upload-artifact@v4
        with:
          name: agent4b-delivery-status
          path: delivery_status.json
          retention-days: 30

      - name: Oppsummering Agent 4b
        run: |
          python - <<'PY'
          import json, os
          s = json.load(open('delivery_status.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Agent 4b – Levering (ukentlig)\n')
              out.write('- Reports: **{}**, sent: **{}**, failed: **{}**, skipped: {}\n'.format(s['reports'], s['sent'], s['failed'], s['skipped']))
          PY
