name: Deploy Fantasy Game Forge

on:
  push:
    branches: [main]
    paths: [fantasygame/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Inject API key
        run: |
          python3 - <<'PY'
          import os
          key = os.environ['ANTHROPIC_API_KEY']
          with open('fantasygame/index.html', 'r') as f:
              content = f.read()
          content = content.replace('__ANTHROPIC_API_KEY__', key)
          with open('fantasygame/index.html', 'w') as f:
              f.write(content)
          if '__ANTHROPIC_API_KEY__' not in content:
              print('✅ API key injected successfully')
          else:
              print('⚠️ WARNING: placeholder not found in file')
          PY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
