name: Deploy Fantasy Game Forge

on:
  push:
    branches: [main]
    paths: [fantasygame/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject API key
        run: |
          python3 - <<'PY'
          import os, sys
          key = os.environ.get('ANTHROPIC_API_KEY', '')
          if not key:
              print('❌ ERROR: ANTHROPIC_API_KEY secret is empty or not set')
              sys.exit(1)
          if not key.startswith('sk-ant-'):
              print(f'❌ ERROR: ANTHROPIC_API_KEY does not look like a valid Anthropic key (got {len(key)} chars, expected prefix sk-ant-)')
              sys.exit(1)
          with open('fantasygame/index.html', 'r') as f:
              content = f.read()
          if '__ANTHROPIC_API_KEY__' not in content:
              print('❌ ERROR: placeholder __ANTHROPIC_API_KEY__ not found in index.html')
              sys.exit(1)
          content = content.replace('__ANTHROPIC_API_KEY__', key)
          with open('fantasygame/index.html', 'w') as f:
              f.write(content)
          print(f'✅ API key injected successfully (key length: {len(key)})')
          PY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fantasygame

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
