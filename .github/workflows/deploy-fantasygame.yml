name: Deploy Fantasy Game Forge

on:
  push:
    branches: [main]
    paths: [fantasygame/**]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Inject API key
        run: |
          python3 - <<'PY'
          import os
          key = os.environ['ANTHROPIC_API_KEY']
          with open('fantasygame/index.html', 'r') as f:
              content = f.read()
          content = content.replace('__ANTHROPIC_API_KEY__', key)
          with open('fantasygame/index.html', 'w') as f:
              f.write(content)
          if '__ANTHROPIC_API_KEY__' not in content:
              print('✅ API key injected successfully')
          else:
              print('⚠️ WARNING: placeholder not found in file')
          PY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fantasygame

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
