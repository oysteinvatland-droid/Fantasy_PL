name: FPL Agent – Test

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Hvilken agent vil du teste?'
        required: true
        type: choice
        options:
          - 'Agent 1 – Data'
          - 'Agent 2 – Analyse (krever Agent 1 først)'
          - 'Agent 3 – Rapport ukentlig (krever Agent 1+2)'
          - 'Agent 3 – Rapport velkomst (krever Agent 1+2)'
          - 'Agent 4 – Levering ukentlig (krever Agent 1+2+3)'
          - 'Agent 4 – Levering velkomst (krever Agent 1+2+3)'
          - 'Kjør alle agenter (full pipeline)'
      test_epost:
        description: 'Test-e-post for Agent 4 (valgfri overstyring)'
        required: false
        default: ''
      force_send:
        description: 'Tving ukentlig utsending uansett deadline'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:


# ─────────────────────────────────────────────────────────────────────────────
# UNIT TESTS
# ─────────────────────────────────────────────────────────────────────────────
  test-unit:
    name: "🧪 Unit tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør pytest
        run: pytest -q


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 1 – DATA
# ─────────────────────────────────────────────────────────────────────────────
  test-agent-data:
    name: "🧪 Agent 1 – Data"
    runs-on: ubuntu-latest
    needs: test-unit
    if: |
      contains(github.event.inputs.agent, 'Agent 1') ||
      github.event.inputs.agent == 'Kjør alle agenter (full pipeline)'
    outputs:
      send_weekly: ${{ steps.les-status.outputs.send_weekly }}
      has_new:     ${{ steps.les-status.outputs.has_new }}
      gw_number:   ${{ steps.les-status.outputs.gw_number }}
      hours_until: ${{ steps.les-status.outputs.hours_until }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Kjør agent_data.py
        env:
          FORCE_SEND: ${{ github.event.inputs.force_send }}
          FIREBASE_BEARER_TOKEN: ${{ secrets.FIREBASE_BEARER_TOKEN }}
          FIREBASE_REQUIRE_AUTH: ${{ vars.FIREBASE_REQUIRE_AUTH || 'false' }}
        run: python agent_data.py

      - name: Les outputs
        id: les-status
        run: |
          SEND=$(python -c "import json; d=json.load(open('deadline_status.json')); print(str(d['send_weekly']).lower())")
          GW=$(python -c "import json; d=json.load(open('deadline_status.json')); print(d.get('gw_number',''))")
          HOURS=$(python -c "import json; d=json.load(open('deadline_status.json')); print(d.get('hours_until',''))")
          HAS_NEW=$(cat has_new_subscribers.txt)
          echo "send_weekly=$SEND"  >> $GITHUB_OUTPUT
          echo "gw_number=$GW"      >> $GITHUB_OUTPUT
          echo "hours_until=$HOURS" >> $GITHUB_OUTPUT
          echo "has_new=$HAS_NEW"   >> $GITHUB_OUTPUT

      - name: "📋 Vis resultater"
        run: |
          echo "──────────────────────────────────"
          echo "📊 AGENT 1 RESULTATER"
          echo "──────────────────────────────────"
          echo "Abonnenter:"
          cat subscribers.json | python -c "import json,sys; subs=json.load(sys.stdin); [print(f'  ✓ {s[\"name\"]} ({s[\"email\"]}) – team {s[\"team_id\"]}') for s in subs]"
          echo ""
          echo "Nye abonnenter:"
          cat new_subscribers.json | python -c "import json,sys; subs=json.load(sys.stdin); print(f'  {len(subs)} nye') if subs else print('  Ingen nye')"
          echo ""
          echo "Deadline-status:"
          cat deadline_status.json | python -m json.tool
          echo ""
          echo "FPL rådata:"
          python -c "
          import json
          d = json.load(open('fpl_raw_data.json'))
          b = d['bootstrap']
          print(f'  Spillere     : {len(b[\"elements\"])}')
          print(f'  Lag          : {len(b[\"teams\"])}')
          print(f'  Fixtures     : {len(d[\"fixtures\"])}')
          print(f'  Historikk    : {len(d[\"spiller_historikk\"])} spillere')
          print(f'  Hentet       : {d[\"hentet_tidspunkt\"]}')
          "

      - name: Last opp artifakter
        uses: actions/upload-artifact@v4
        with:
          name: test-agent1-data
          path: |
            fpl_raw_data.json
            subscribers.json
            new_subscribers.json
            has_new_subscribers.txt
            deadline_status.json
          retention-days: 3


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 2 – ANALYSE
# ─────────────────────────────────────────────────────────────────────────────
  test-agent-analyse:
    name: "🧪 Agent 2 – Analyse"
    runs-on: ubuntu-latest
    needs: test-agent-data
    if: |
      always() && (
        contains(github.event.inputs.agent, 'Agent 2') ||
        contains(github.event.inputs.agent, 'Agent 3') ||
        contains(github.event.inputs.agent, 'Agent 4') ||
        github.event.inputs.agent == 'Kjør alle agenter (full pipeline)'
      )

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data fra Agent 1
        uses: actions/download-artifact@v4
        with:
          name: test-agent1-data

      - name: Kjør agent_analyse.py
        run: python agent_analyse.py

      - name: "📋 Vis resultater"
        run: |
          echo "──────────────────────────────────"
          echo "📊 AGENT 2 RESULTATER"
          echo "──────────────────────────────────"
          python -c "
          import json
          d = json.load(open('fpl_analysis.json'))
          print('Topp 5 spisser:')
          for p in d['topp_spisser'][:5]:
              print(f'  {p[\"web_name\"]} ({p[\"lag_short\"]}) – score: {p[\"score\"]:.1f} – pris: {p[\"pris_mill\"]}m')
          print('')
          print('Topp 5 midtbane:')
          for p in d['topp_midtbane'][:5]:
              print(f'  {p[\"web_name\"]} ({p[\"lag_short\"]}) – score: {p[\"score\"]:.1f} – pris: {p[\"pris_mill\"]}m')
          print('')
          print('Topp 5 forsvar:')
          for p in d['topp_forsvar'][:5]:
              print(f'  {p[\"web_name\"]} ({p[\"lag_short\"]}) – score: {p[\"score\"]:.1f} – pris: {p[\"pris_mill\"]}m')
          print('')
          print('Topp 3 keepere:')
          for p in d['topp_keepere'][:3]:
              print(f'  {p[\"web_name\"]} ({p[\"lag_short\"]}) – score: {p[\"score\"]:.1f} – pris: {p[\"pris_mill\"]}m')
          print('')
          print('Value for money topp 3:')
          for p in d['value_for_money'][:3]:
              print(f'  {p[\"web_name\"]} ({p[\"lag_short\"]}) – {p[\"pris_mill\"]}m – {p[\"total_points\"]}pts')
          "

      - name: Last opp artifakter
        uses: actions/upload-artifact@v4
        with:
          name: test-agent2-analyse
          path: fpl_analysis.json
          retention-days: 3


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 3 – RAPPORT
# ─────────────────────────────────────────────────────────────────────────────
  test-agent-rapport:
    name: "🧪 Agent 3 – Rapport"
    runs-on: ubuntu-latest
    needs: [test-agent-data, test-agent-analyse]
    if: |
      always() && (
        contains(github.event.inputs.agent, 'Agent 3') ||
        contains(github.event.inputs.agent, 'Agent 4') ||
        github.event.inputs.agent == 'Kjør alle agenter (full pipeline)'
      )

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data fra Agent 1 og 2
        uses: actions/download-artifact@v4
        with:
          pattern: test-agent{1,2}-*
          merge-multiple: true

      - name: Kjør agent_rapport.py (ukentlig)
        if: |
          contains(github.event.inputs.agent, 'ukentlig') ||
          github.event.inputs.agent == 'Kjør alle agenter (full pipeline)'
        run: python agent_rapport.py

      - name: Kjør agent_rapport.py (velkomst)
        if: contains(github.event.inputs.agent, 'velkomst')
        run: python agent_rapport.py --welcome

      - name: "📋 Vis resultater"
        run: |
          echo "──────────────────────────────────"
          echo "📊 AGENT 3 RESULTATER"
          echo "──────────────────────────────────"
          python -c "
          import json, os, glob
          for fname in ['generated_reports.json', 'welcome_reports.json']:
              if os.path.exists(fname):
                  reports = json.load(open(fname))
                  print(f'{fname}: {len(reports)} rapporter')
                  for r in reports:
                      size = os.path.getsize(r['report_file']) if os.path.exists(r['report_file']) else 0
                      print(f'  ✓ {r[\"name\"]} → {r[\"report_file\"]} ({size/1024:.0f} KB)')
          html_files = glob.glob('reports/*.html')
          print(f'HTML-filer generert: {len(html_files)}')
          "

      - name: Last opp rapport-artifakter
        uses: actions/upload-artifact@v4
        with:
          name: test-agent3-rapporter
          path: |
            generated_reports.json
            welcome_reports.json
            reports/
          retention-days: 3
          if-no-files-found: ignore


# ─────────────────────────────────────────────────────────────────────────────
# AGENT 4 – LEVERING
# Sender til test-e-post hvis oppgitt, ellers til vanlige abonnenter
# ─────────────────────────────────────────────────────────────────────────────
  test-agent-levering:
    name: "🧪 Agent 4 – Levering"
    runs-on: ubuntu-latest
    needs: [test-agent-data, test-agent-rapport]
    if: |
      always() && (
        contains(github.event.inputs.agent, 'Agent 4') ||
        github.event.inputs.agent == 'Kjør alle agenter (full pipeline)'
      )

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install -r requirements.txt

      - name: Last ned data og rapporter
        uses: actions/download-artifact@v4
        with:
          pattern: test-agent{1,3}-*
          merge-multiple: true

      - name: Overstyr e-post med test-adresse (valgfritt)
        if: github.event.inputs.test_epost != ''
        run: |
          TEST_EMAIL="${{ github.event.inputs.test_epost }}"
          echo "📧 Overstyrer alle e-poster til: $TEST_EMAIL"
          python -c "
          import json, sys
          test_email = '$TEST_EMAIL'
          for fname in ['generated_reports.json', 'welcome_reports.json']:
              try:
                  reports = json.load(open(fname))
                  for r in reports:
                      r['email'] = test_email
                  json.dump(reports, open(fname, 'w'), indent=2)
                  print(f'✓ {fname}: alle e-poster satt til {test_email}')
              except FileNotFoundError:
                  pass
          "

      - name: Kjør levering-agent (ukentlig)
        if: |
          contains(github.event.inputs.agent, 'ukentlig') ||
          github.event.inputs.agent == 'Kjør alle agenter (full pipeline)'
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          GW_NUMBER:      ${{ needs.test-agent-data.outputs.gw_number }}
          HOURS_UNTIL:    ${{ needs.test-agent-data.outputs.hours_until }}
          FIREBASE_BEARER_TOKEN: ${{ secrets.FIREBASE_BEARER_TOKEN }}
          FIREBASE_REQUIRE_AUTH: ${{ vars.FIREBASE_REQUIRE_AUTH || 'false' }}
        run: python agent_levering.py

      - name: Kjør levering-agent (velkomst)
        if: contains(github.event.inputs.agent, 'velkomst')
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          FIREBASE_BEARER_TOKEN: ${{ secrets.FIREBASE_BEARER_TOKEN }}
          FIREBASE_REQUIRE_AUTH: ${{ vars.FIREBASE_REQUIRE_AUTH || 'false' }}
        run: python agent_levering.py --welcome
